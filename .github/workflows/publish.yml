name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance attestation.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Verify package contents
        run: npm pack --dry-run

      # npm >= 11.5.1 is required for trusted publishing (OIDC). Pinned to the 11.x
      # range rather than @latest: npm 12 requires Node >= 22.22.2 and would break
      # this job the moment it became latest.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Publish
        run: npm publish --provenance
        env:
          # Not needed once trusted publishing is configured for this package on
          # npmjs.com (Settings -> Trusted publishers). Kept as a fallback for
          # token-based publishing; npm is restricting 2FA-bypass tokens from Jan 2027.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
